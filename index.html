<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.webp" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Приглашение</title>
  </head>
  <body>
    <div class="page">
      <main class="invite container">
        <section class="section hero">
          <div class="hero__frame" role="img" aria-label="Фото Софии">
            <img class="hero__photo" src="/src/assets/images/collage.JPG" alt="София" />
          </div>
          <h1 class="hero__name">Софии 6 лет</h1>
          <p class="hero__lead">Будем рады видеть вас</p>
          <p class="hero__text">
            на дне рождения Софии,<br />
            этот день будет наполнен радостью и смехом
          </p>
          <div class="hero__details">
            <div>Праздник пройдет</div>
            <div>в нашем детском саду</div>
            <div>28 апреля</div>
            <div>15:30 — 17:00</div>
          </div>
        </section>

        <section class="section calendar">
          <h2 class="calendar__title">Апрель</h2>
          <div class="calendar__grid">
            <span class="calendar__day">1</span>
            <span class="calendar__day">2</span>
            <span class="calendar__day">3</span>
            <span class="calendar__day">4</span>
            <span class="calendar__day">5</span>
            <span class="calendar__day">6</span>
            <span class="calendar__day">7</span>
            <span class="calendar__day">8</span>
            <span class="calendar__day">9</span>
            <span class="calendar__day">10</span>
            <span class="calendar__day">11</span>
            <span class="calendar__day">12</span>
            <span class="calendar__day">13</span>
            <span class="calendar__day">14</span>
            <span class="calendar__day">15</span>
            <span class="calendar__day">16</span>
            <span class="calendar__day">17</span>
            <span class="calendar__day">18</span>
            <span class="calendar__day">19</span>
            <span class="calendar__day">20</span>
            <span class="calendar__day">21</span>
            <span class="calendar__day">22</span>
            <span class="calendar__day">23</span>
            <span class="calendar__day">24</span>
            <span class="calendar__day">25</span>
            <span class="calendar__day">26</span>
            <span class="calendar__day">27</span>
            <span class="calendar__day calendar__day--marked">
              <img class="calendar__ring" src="/src/assets/images/calendar-ring.png" alt="" />
              28
            </span>
            <span class="calendar__day">29</span>
            <span class="calendar__day">30</span>
          </div>
        </section>

        <section class="section cake">
          <img class="cake__image" src="/src/assets/images/cake.svg" alt="Праздничный торт" />
        </section>

        <footer class="section footer">
          <p class="footer__title">С любовью</p>
          <p class="footer__text">семья Софии</p>
          <a class="footer__link" href="#" aria-label="Связаться в Telegram">
            <img class="footer__icon" src="/src/assets/images/telegram-icon.svg" alt="" />
          </a>
        </footer>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
